<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pitch Roulette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column, three stacked card groups (buzzword / industry / audience), fixed pitch bar at the bottom, full-screen pitch card on top. Single dark look, system fonts only so it works offline. */
:root{
  color-scheme:dark;
  --bg:#0f1114;
  --panel:#171a1f;
  --panel-2:#1e222a;
  --line:#2a2f38;
  --fg:#ece9e2;
  --muted:#8d939e;
  --accent:#f2d675;
  --accent-ink:#1b1707;
  --buzz:#a99bff; --buzz-bg:rgba(169,155,255,.13);
  --ind:#5fd0c0;  --ind-bg:rgba(95,208,192,.12);
  --aud:#ff9a7a;  --aud-bg:rgba(255,154,122,.12);
  --f-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent}
.app{
  max-width:520px;margin:0 auto;
  padding-block:20px 150px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
header{margin-bottom:22px}
h1{font:700 1.9rem/1.05 var(--f-display);margin:0;letter-spacing:-.01em}
.tag{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.count{margin:10px 0 0;font:.7rem var(--f-mono);color:#5d636e;letter-spacing:.04em}

section{margin-bottom:22px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.sec-label{font:600 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.14em}
.sec-buzz .sec-label{color:var(--buzz)}
.sec-ind .sec-label{color:var(--ind)}
.sec-aud .sec-label{color:var(--aud)}
.redraw{
  background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:6px 12px;font:.78rem var(--f-body);cursor:pointer;min-height:32px;
}
.redraw:disabled{opacity:.4;cursor:default}
.redraw:focus-visible,.card:focus-visible,.btn:focus-visible,.name-btn:focus-visible,.close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.cards{display:flex;flex-direction:column;gap:8px}
.card{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--panel);border:1.5px solid var(--line);border-radius:12px;
  padding:13px 14px;min-height:50px;cursor:pointer;user-select:none;text-align:left;color:var(--fg);
  font:1.02rem/1.25 var(--f-body);width:100%;
  transition:background .12s,border-color .12s,transform .08s;
}
.card:active{transform:scale(.99)}
.card .mark{
  flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:.7rem;color:transparent;
}
.sec-buzz .card.on{border-color:var(--buzz);background:var(--buzz-bg)}
.sec-ind  .card.on{border-color:var(--ind);background:var(--ind-bg)}
.sec-aud  .card.on{border-color:var(--aud);background:var(--aud-bg)}
.sec-buzz .card.on .mark{background:var(--buzz);border-color:var(--buzz);color:#14112b}
.sec-ind  .card.on .mark{background:var(--ind);border-color:var(--ind);color:#06201c}
.sec-aud  .card.on .mark{background:var(--aud);border-color:var(--aud);color:#2b1008}
.card.wild{border-style:dashed}
.card input{
  flex:1;min-width:0;background:transparent;border:none;border-bottom:1px dashed #4a505b;
  color:var(--fg);font:inherit;padding:2px 0;outline:none;
}
.card input:focus{border-bottom-color:var(--accent)}
.card input::placeholder{color:#6b717c}

.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,17,20,.96);
  border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));
}
.bar-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.preview{font:1.02rem/1.3 var(--f-display);min-height:2.6em;display:flex;align-items:center;color:var(--fg)}
.preview .ph{color:#5d636e}
.b{color:var(--buzz)} .i{color:var(--ind)} .a{color:var(--aud)} .f{color:var(--muted);font-style:italic}
.bar-row{display:flex;gap:8px}
.btn{
  flex:1;border:none;border-radius:12px;padding:14px 16px;font:600 1rem var(--f-body);cursor:pointer;min-height:48px;
  background:var(--accent);color:var(--accent-ink);
}
.btn.ghost{flex:none;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.35;cursor:default}

/* full-screen pitch */
.overlay{
  position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  padding:calc(72px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
}
.overlay[hidden]{display:none}
.close{
  position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));
  width:44px;height:44px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--fg);font-size:1.1rem;cursor:pointer;
}
.name-lab{font:.7rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.name-btn{
  background:none;border:none;color:var(--accent);font:700 clamp(2rem,10vw,3.2rem)/1.05 var(--f-display);
  letter-spacing:-.01em;cursor:pointer;padding:4px 8px;
}
.name-hint{font-size:.72rem;color:#5d636e;margin-top:-14px}
.pitch{
  font:700 clamp(1.7rem,7.4vw,2.7rem)/1.18 var(--f-display);margin:0;max-width:16em;text-wrap:balance;
}
.timer{font:600 2.4rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg);min-height:1.2em}
.timer.low{color:var(--aud)}
.over-actions{display:flex;gap:8px;width:100%;max-width:360px}
.over-actions .btn{flex:1}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Pitch Roulette</h1>
    <p class="tag">Pick one of each. Pitch it out loud.</p>
    <p class="count" id="count"></p>
  </header>

  <section class="sec-buzz" id="sec-buzz"></section>
  <section class="sec-ind" id="sec-ind"></section>
  <section class="sec-aud" id="sec-aud"></section>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="preview" id="preview"></div>
    <div class="bar-row">
      <button class="btn ghost" id="newHand" type="button">New hand</button>
      <button class="btn" id="pitchBtn" type="button" disabled>Pitch it</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <button class="close" id="closeBtn" type="button" aria-label="Close">✕</button>
  <div class="name-lab">Introducing</div>
  <button class="name-btn" id="nameBtn" type="button"></button>
  <div class="name-hint">tap the name for a new one</div>
  <p class="pitch" id="pitchText"></p>
  <div class="timer" id="timer">0:30</div>
  <div class="over-actions">
    <button class="btn ghost" id="timerBtn" type="button">Start 30s timer</button>
  </div>
</div>

const KEYS = ['buzz','ind','aud'];
const HAND_SIZE = 3;
const WILD_CHANCE = 0.10;

let decks = {}, hand = {}, sel = {}, redrawn = {}, drawn = 0, timerId = null, remaining = 30, wake = null;
let startupName = '';

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function drawCard(k){
  if(Math.random() < WILD_CHANCE) return {wild:true, text:''};
  if(!decks[k] || !decks[k].length) decks[k] = shuffle(BANK[k].words.slice());
  drawn++;
  return {text:decks[k].pop()};
}
function dealCategory(k){
  hand[k] = [];
  for(let i=0;i<HAND_SIZE;i++) hand[k].push(drawCard(k));
  sel[k] = null;
}
function newHand(){
  KEYS.forEach(k=>{ dealCategory(k); redrawn[k] = false; });
  render();
}

function chosen(k){
  if(sel[k]===null) return '';
  return (hand[k][sel[k]].text || '').trim();
}

function render(){
  KEYS.forEach(k=>{
    const sec = document.getElementById('sec-'+k);
    sec.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'sec-head';
    const lab = document.createElement('div');
    lab.className = 'sec-label';
    lab.textContent = BANK[k].label;
    const rd = document.createElement('button');
    rd.type = 'button';
    rd.className = 'redraw';
    rd.textContent = redrawn[k] ? 'Redrawn' : '↻ Redraw';
    rd.disabled = redrawn[k];
    rd.onclick = ()=>{ dealCategory(k); redrawn[k] = true; render(); };
    head.append(lab, rd);
    sec.appendChild(head);

    const list = document.createElement('div');
    list.className = 'cards';
    hand[k].forEach((card, idx)=>{
      const on = sel[k] === idx;
      const el = document.createElement('div');
      el.className = 'card' + (on ? ' on' : '') + (card.wild ? ' wild' : '');
      el.tabIndex = 0;
      el.setAttribute('role','button');
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
      if(card.wild){
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.id = 'wild-'+k+'-'+idx;
        inp.placeholder = 'Blank card: write your own';
        inp.maxLength = 40;
        inp.value = card.text;
        inp.oninput = ()=>{ card.text = inp.value; updatePreview(); };
        inp.onclick = e=>{ e.stopPropagation(); };
        inp.onkeydown = e=>{ e.stopPropagation(); };
        el.appendChild(inp);
      } else {
        const t = document.createElement('span');
        t.textContent = card.text;
        el.appendChild(t);
      }
      const mark = document.createElement('span');
      mark.className = 'mark';
      mark.textContent = '✓';
      el.appendChild(mark);
      const toggle = ()=>{ sel[k] = on ? null : idx; render(); };
      el.onclick = toggle;
      el.onkeydown = e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); } };
      list.appendChild(el);
    });
    sec.appendChild(list);
  });
  updatePreview();
  const total = KEYS.reduce((s,k)=>s+BANK[k].words.length,0);
  document.getElementById('count').textContent = total + ' cards in the deck · ' + drawn + ' drawn this session';
}

function updatePreview(){
  const b = chosen('buzz'), i = chosen('ind'), a = chosen('aud');
  const el = document.getElementById('preview');
  el.innerHTML = '';
  const part = (cls, txt, ph)=>{
    const s = document.createElement('span');
    if(txt){ s.className = cls; s.textContent = txt; } else { s.className = 'ph'; s.textContent = ph; }
    return s;
  };
  const f = document.createElement('span');
  f.className = 'f'; f.textContent = ' for ';
  const wrap = document.createElement('span');
  wrap.append(part('b', b, 'buzzword'), document.createTextNode(' '), part('i', i, 'industry'), f, part('a', a, 'audience'));
  el.appendChild(wrap);
  document.getElementById('pitchBtn').disabled = !(b && i && a);
}

/* startup name generator */
const NAME_A = ['Zap','Nimbl','Gloop','Flux','Blip','Yeti','Kiwi','Pivot','Moxie','Snag','Quill','Zest','Lumen','Bodega','Tango','Fizz','Orbit','Mango','Pebble','Vortex','Bloop','Hoot'];
const NAME_B = ['ly','ify','io','r','ster','hub','ora','ful','z','base','ium','ee',' Labs',' & Co.'];
function makeName(){
  const a = NAME_A[Math.floor(Math.random()*NAME_A.length)];
  const b = NAME_B[Math.floor(Math.random()*NAME_B.length)];
  return a + b;
}

/* pitch screen */
function openPitch(){
  const b = chosen('buzz'), i = chosen('ind'), a = chosen('aud');
  if(!(b && i && a)) return;
  startupName = makeName();
  document.getElementById('nameBtn').textContent = startupName;
  const p = document.getElementById('pitchText');
  p.innerHTML = '';
  const mk = (cls, txt)=>{ const s=document.createElement('span'); s.className=cls; s.textContent=txt; return s; };
  p.append(mk('b', b), document.createTextNode(' '), mk('i', i), mk('f', ' for '), mk('a', a));
  resetTimer();
  document.getElementById('overlay').hidden = false;
  document.getElementById('overlay').scrollTop = 0;
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(w=>{ wake = w; }).catch(()=>{}); }catch(e){}
}
function closePitch(){
  stopTimer();
  document.getElementById('overlay').hidden = true;
  try{ if(wake){ wake.release(); wake = null; } }catch(e){}
}
function fmt(s){ return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function resetTimer(){
  stopTimer();
  remaining = 30;
  const t = document.getElementById('timer');
  t.textContent = fmt(remaining);
  t.classList.remove('low');
  document.getElementById('timerBtn').textContent = 'Start 30s timer';
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }
function toggleTimer(){
  const btn = document.getElementById('timerBtn');
  const t = document.getElementById('timer');
  if(timerId || remaining === 0){ resetTimer(); return; }
  btn.textContent = 'Reset';
  timerId = setInterval(()=>{
    remaining--;
    t.textContent = remaining > 0 ? fmt(remaining) : "Time's up";
    t.classList.toggle('low', remaining <= 10);
    if(remaining <= 0){
      stopTimer();
      try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
    }
  }, 1000);
}

document.getElementById('newHand').onclick = newHand;
document.getElementById('pitchBtn').onclick = openPitch;
document.getElementById('closeBtn').onclick = closePitch;
document.getElementById('timerBtn').onclick = toggleTimer;
document.getElementById('nameBtn').onclick = ()=>{
  startupName = makeName();
  document.getElementById('nameBtn').textContent = startupName;
};

newHand();
